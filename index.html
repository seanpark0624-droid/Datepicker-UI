<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Datepicker UI</title>
        <link rel=stylesheet href="styles.css">
    </head>

    <body>
        <div class="container">
            <div class="top">
                <input type="text" placeholder="dd/mm/yyyy">
                <button>
                    <img src="icon.png">
                </button>
            </div>

            <div class="calendar">
                <table>
                    <caption>
                        <span class="left-arrow arrow">◀</span>
                        <span>December 2022</span>
                        <span class="right-arrow arrow">▶</span>
                    </caption>
                    <thead>
                        <tr>
                            <th scope="col">S</th>
                            <th scope="col">M</th>
                            <th scope="col">T</th>
                            <th scope="col">W</th>
                            <th scope="col">T</th>
                            <th scope="col">F</th>
                            <th scope="col">S</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td class="left-empty top-empty"></td>
                            <td class="top-empty"></td>
                            <td class="top-empty"></td>
                            <td class="top-empty"></td>
                            <td class="top-empty">1</td>
                            <td class="top-empty">2</td>
                            <td class="top-empty right-empty">3</td>
                        </tr>

                        <tr>
                            <td class="left-empty">4</td>
                            <td>5</td>
                            <td>6</td>
                            <td>7</td>
                            <td>8</td>
                            <td>9</td>
                            <td class="right-empty">10</td>
                        </tr>

                        <tr>
                            <td class="left-empty">11</td>
                            <td>12</td>
                            <td>13</td>
                            <td>14</td>
                            <td>15</td>
                            <td>16</td>
                            <td class="right-empty">17</td>
                        </tr>

                        <tr>
                            <td class="left-empty">18</td>
                            <td>19</td>
                            <td>20</td>
                            <td>21</td>
                            <td>22</td>
                            <td>23</td>
                            <td class="right-empty">24</td>
                        </tr>

                        <tr>
                            <td class="left-empty bottom-empty">25</td>
                            <td class=" bottom-empty">26</td>
                            <td class=" bottom-empty">27</td>
                            <td class=" bottom-empty">28</td>
                            <td class=" bottom-empty">29</td>
                            <td class=" bottom-empty">30</td>
                            <td class=" bottom-empty right-empty">31</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </body>
</html>
